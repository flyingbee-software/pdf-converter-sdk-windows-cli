<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- ================= macOS Font Directories ================= -->
    <!-- macOS Core System Fonts (Usually commented out as they are included by default) -->
    <!-- <dir>/System/Library/Fonts</dir> -->
    <!-- macOS Global User Fonts -->
    <dir>/Library/Fonts</dir>
    <!-- macOS Current User Fonts -->
    <dir>~/Library/Fonts</dir>

    <!-- ================= Linux Font Directories ================= -->
    <!-- Linux System-wide Fonts -->
    <dir>/usr/share/fonts</dir>
    <!-- Linux Local/Administrator Installed Fonts -->
    <dir>/usr/local/share/fonts</dir>
    <!-- Linux Current User Fonts (XDG compliant) -->
    <dir>~/.local/share/fonts</dir>

    <!-- ================= Windows Font Directories ================= -->
    <!-- Windows System Fonts (Note: ~ resolves to C:\Users\<username> on Windows) -->
    <dir>C:/Windows/Fonts</dir>
    <!-- Windows Current User Fonts (Supported on Windows 10/11) -->
    <dir>~/AppData/Local/Microsoft/Windows/Fonts</dir>

    <!-- ================= Custom / Application Font Directories ================= -->
    <!-- Your custom application fonts folder (Modify path as needed) -->
    <!-- <dir>/path/to/your/app/fonts</dir> -->

    <!-- ================= Homebrew / Package Manager Includes ================= -->
    <!-- Include Homebrew fontconfig configuration if installed via Homebrew -->
    <!-- <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include> -->
    <!-- Include Linux system fontconfig configuration if installed via package manager -->
    <!-- <include ignore_missing="yes">/etc/fonts/conf.d</include> -->

</fontconfig>